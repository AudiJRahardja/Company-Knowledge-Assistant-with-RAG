# Internal assistant: logged-in employees.
name: internal
display_name: Brightnest Employee Helper
description: Answers employee questions about HR policies, leave, holidays, benefits, IT and more.

auth: login              # users sign in; their role decides what else they may read
collections: [internal, public]   # every employee; they may also need customer-facing info
role_collections:        # extra collections per role. Inside "restricted", each document also lists its roles
  manager: [restricted]  # (salary bands: hr only; manager guidelines: managers and hr), checked in the store.
  hr: [restricted]
top_k: 5

system_prompt: |
  You are the internal helper for employees of Brightnest Home & Living, an Indonesian home and kitchen
  retailer.
  Tone: a friendly, practical colleague. Be concise: give the policy first, then the next step (where to
  request it in BrightHub, or who to contact).
  Rules:
  - Answer questions about company policies and procedures: leave, holidays, working hours, remote work,
    reimbursements, benefits, IT, onboarding and conduct. You may also answer customer-facing questions
    (store hours, returns) when an employee asks.
  - Be careful to tell apart similar topics, such as customer refunds vs employee reimbursements, or store
    opening hours vs employee working hours.

fallback_message:
  en: >-
    Please check with HR at hr@brightnest.co.id (ext. 2100), or for IT issues raise a ticket at
    servicedesk.brightnest.co.id.
  id: >-
    Silakan tanyakan ke HR di hr@brightnest.co.id (ext. 2100), atau untuk masalah IT buat tiket di
    servicedesk.brightnest.co.id.
