# docker compose up --build        -> http://localhost:8000 (shop + widget), /web/internal.html, /docs
#
# Settings come from .env (GEMINI_API_KEY, JWT_SECRET, ...). The index, logs and mock database live in the
# "storage" volume; the downloaded models in "models", so a restart does not download them again.

services:
  assistant:
    build: .
    image: brightnest-assistant
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      EMBEDDING_DEVICE: auto
    volumes:
      - storage:/app/storage
      - models:/cache/huggingface
    restart: unless-stopped

  # A customer-only server whose index holds ONLY public documents: internal data is not just hidden,
  # it is not in this container's database at all. Start it with:
  #   docker compose --profile split up --build customer
  customer:
    profiles: ["split"]
    build: .
    image: brightnest-assistant
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      ASSISTANTS: external
      INGEST_COLLECTIONS: public
    volumes:
      - customer-storage:/app/storage
      - models:/cache/huggingface
    restart: unless-stopped

volumes:
  storage:
  customer-storage:
  models:
