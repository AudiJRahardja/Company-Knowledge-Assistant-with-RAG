# NVIDIA GPU (needs the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  assistant:
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
